<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cosmic Free Kicks</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background-color: #0b1120;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
    }
    #canvas-container {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    .glow-title {
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden select-none bg-slate-950 text-slate-100">

  <!-- TOP HEADER UI -->
  <header class="flex-none px-3 pt-2 pb-1 bg-slate-900/90 border-b border-slate-800 z-10">
    <div class="flex items-center justify-between text-xs sm:text-sm font-semibold mb-1">
      <h1 class="text-sky-400 font-extrabold text-sm sm:text-base glow-title flex items-center gap-1">
        ⚽ COSMIC FREE KICKS
      </h1>
      <div class="flex items-center gap-2 sm:gap-3 text-slate-300">
        <div>Score: <span id="score" class="text-amber-300 font-bold">0</span></div>
        <div>High: <span id="highScore" class="text-amber-300 font-bold">0</span></div>
      </div>
    </div>

    <div class="flex items-center justify-between text-xs text-slate-300 border-t border-slate-800/60 pt-1">
      <div class="flex items-center gap-2">
        <span>Streak: <span id="streak" class="text-amber-300 font-bold">0</span></span>
        <span id="multiplier" class="text-emerald-400 font-extrabold">×1</span>
      </div>
      <div id="kickInfo" class="text-cyan-300 font-medium truncate max-w-[180px] text-right">
        Close range — 50 pts
      </div>
    </div>
  </header>

  <!-- GAME CANVAS CONTAINER -->
  <div id="canvas-container" class="relative flex-1 w-full bg-slate-950">
    <canvas id="gameCanvas"></canvas>

    <!-- OVERLAY (Game Over / Start) -->
    <div id="overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20 hidden">
      <h2 id="resultTitle" class="text-2xl sm:text-3xl font-black text-sky-400 mb-2 glow-title">Game Over</h2>
      <p class="text-slate-200 text-base mb-1">Final Score: <span id="finalScore" class="text-amber-300 font-bold">0</span></p>
      <p class="text-slate-400 text-sm mb-3">High Score: <span id="finalHigh" class="text-amber-300 font-bold">0</span></p>
      <p id="goalsText" class="text-emerald-400 font-medium text-sm mb-6"></p>

      <div class="flex flex-col gap-3 w-full max-w-xs">
        <button id="restartBtn" class="w-full py-3 px-6 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg transition active:scale-95">
          Play Again
        </button>
        <button id="shareBtn" class="w-full py-2.5 px-6 bg-slate-800 hover:bg-slate-700 text-sky-300 font-semibold rounded-xl border border-sky-500/30 transition active:scale-95 text-sm">
          Share High Score 🚀
        </button>
      </div>
    </div>
  </div>

  <!-- BOTTOM CONTROLS & SHOT TYPES -->
  <footer class="flex-none p-2 bg-slate-900 border-t border-slate-800 z-10">
    <div class="grid grid-cols-3 gap-2 max-w-md mx-auto">
      <button id="btn-blast" class="shot-btn py-2 px-1 text-center rounded-lg bg-sky-900/60 border-2 border-sky-400 text-sky-200 font-bold text-xs sm:text-sm active:scale-95 transition">
        🚀 BLAST
      </button>
      <button id="btn-chip" class="shot-btn py-2 px-1 text-center rounded-lg bg-slate-800 border border-slate-700 text-slate-400 font-bold text-xs sm:text-sm active:scale-95 transition">
        🎈 CHIP
      </button>
      <button id="btn-curve" class="shot-btn py-2 px-1 text-center rounded-lg bg-slate-800 border border-slate-700 text-slate-400 font-bold text-xs sm:text-sm active:scale-95 transition">
        🌀 CURVE
      </button>
    </div>
  </footer>

  <script>
    // Safe Telegram WebApp Initialization
    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#0f172a');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#0b1120');
      } catch (e) {
        console.warn('Telegram WebApp setup warning:', e);
      }
    }

    // Safe LocalStorage Wrapper
    function getStoredScore() {
      try {
        return parseInt(localStorage.getItem('cosmicFreeKickHigh') || '0');
      } catch (e) {
        return 0;
      }
    }

    function setStoredScore(val) {
      try {
        localStorage.setItem('cosmicFreeKickHigh', val.toString());
      } catch (e) {
        console.warn('LocalStorage unavailable:', e);
      }
    }

    // Canvas & Context Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    // UI Elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const streakEl = document.getElementById('streak');
    const multiplierEl = document.getElementById('multiplier');
    const kickInfoEl = document.getElementById('kickInfo');
    const overlay = document.getElementById('overlay');
    const finalScoreEl = document.getElementById('finalScore');
    const finalHighEl = document.getElementById('finalHigh');
    const goalsTextEl = document.getElementById('goalsText');
    const resultTitleEl = document.getElementById('resultTitle');
    const restartBtn = document.getElementById('restartBtn');
    const shareBtn = document.getElementById('shareBtn');

    const shotBtns = {
      blast: document.getElementById('btn-blast'),
      chip: document.getElementById('btn-chip'),
      curve: document.getElementById('btn-curve')
    };

    // Responsive Canvas Resolution Scaling
    let width = 360;
    let height = 500;
    let scaleRatio = 1;

    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      width = rect.width;
      height = rect.height;

      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      ctx.resetTransform();
      ctx.scale(dpr, dpr);

      // Scale base dimensions relative to 520px reference height
      scaleRatio = height / 520;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Game State
    let highScore = getStoredScore();
    highScoreEl.textContent = highScore;

    let score = 0, streak = 0, goals = 0, gameOver = false;
    let phase = 'aim'; // 'aim', 'power', 'flying', 'result'
    let power = 0, charging = false, aimAngle = 0;
    let resultTimer = 0, message = '', messageTimer = 0;
    let shotType = 'blast';
    let trail = [];

    const baseLevels = [
      { name: 'Close range', points: 50, ballYRatio: 0.72, defenders: 1 },
      { name: 'Medium range', points: 80, ballYRatio: 0.78, defenders: 2 },
      { name: 'Long range', points: 120, ballYRatio: 0.83, defenders: 2 },
      { name: 'Far range', points: 160, ballYRatio: 0.88, defenders: 3 },
      { name: 'Extreme', points: 200, ballYRatio: 0.90, defenders: 3 }
    ];

    const ball = { x: 0, y: 0, vx: 0, vy: 0, radius: 9, active: false, spin: 0 };
    const keeper = { x: 0, y: 0, width: 36, height: 44, diveDir: 0, diveProgress: 0, diving: false };
    const goal = { x: 0, y: 0, width: 220, height: 65 };
    let defenders = [];
    let pointerDown = false, lastX = 0, lastY = 0;

    // Cross-Browser Compatible Rounded Rectangle
    function drawRoundRect(x, y, w, h, r, fill, stroke) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function setShotType(type) {
      if (phase === 'flying' || phase === 'result' || gameOver) return;
      shotType = type;

      Object.keys(shotBtns).forEach(k => {
        const btn = shotBtns[k];
        if (k === type) {
          btn.className = "shot-btn py-2 px-1 text-center rounded-lg bg-sky-900/60 border-2 border-sky-400 text-sky-200 font-bold text-xs sm:text-sm active:scale-95 transition";
        } else {
          btn.className = "shot-btn py-2 px-1 text-center rounded-lg bg-slate-800 border border-slate-700 text-slate-400 font-bold text-xs sm:text-sm active:scale-95 transition";
        }
      });
    }

    function getMultiplier() {
      if (streak >= 10) return 3;
      if (streak >= 6) return 2.5;
      if (streak >= 3) return 2;
      if (streak >= 1) return 1.5;
      return 1;
    }

    function updateMultiplierUI() {
      const m = getMultiplier();
      multiplierEl.textContent = '×' + m;
      if (m >= 2.5) multiplierEl.style.color = '#f472b6';
      else if (m >= 2) multiplierEl.style.color = '#4ade80';
      else if (m >= 1.5) multiplierEl.style.color = '#fde68a';
      else multiplierEl.style.color = '#94a3b8';
    }

    function getCurrentLevel() {
      const idx = Math.min(streak, baseLevels.length - 1);
      const level = Object.assign({}, baseLevels[idx]);
      if (streak >= baseLevels.length) {
        const extra = streak - baseLevels.length + 1;
        level.defenders = Math.min(5, 3 + Math.floor(extra / 2));
        level.points = 200 + extra * 30;
        level.name = 'Extreme +' + extra;
        level.ballYRatio = 0.90;
      }
      return level;
    }

    function createDefenders(count) {
      defenders = [];
      const wallY = height * 0.36;
      const spacing = count > 3 ? 28 : 34;
      const totalWidth = (count - 1) * spacing;
      const startXPos = (width / 2) - totalWidth / 2;
      for (let i = 0; i < count; i++) {
        defenders.push({
          x: startXPos + i * spacing,
          y: wallY,
          baseX: startXPos + i * spacing,
          width: 20,
          height: 36,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function resetForKick() {
      const level = getCurrentLevel();
      goal.width = Math.min(240, width * 0.65);
      goal.height = 60 * scaleRatio;
      goal.x = (width - goal.width) / 2;
      goal.y = 35 * scaleRatio;

      ball.x = width / 2;
      ball.y = height * level.ballYRatio;
      ball.vx = 0; ball.vy = 0; ball.active = false; ball.spin = 0;
      aimAngle = 0; power = 0; charging = false; phase = 'aim';

      keeper.x = width / 2;
      keeper.y = goal.y + goal.height - 18;
      keeper.diveDir = 0; keeper.diveProgress = 0; keeper.diving = false;

      trail = [];
      createDefenders(level.defenders);
      streakEl.textContent = streak;
      updateMultiplierUI();
      kickInfoEl.textContent = level.name + ' • ' + level.defenders + ' Def';
      message = '';
    }

    function startGame() {
      score = 0; streak = 0; goals = 0; gameOver = false;
      scoreEl.textContent = 0; streakEl.textContent = 0;
      updateMultiplierUI();
      overlay.classList.add('hidden');
      setShotType('blast');
      resetForKick();
    }

    function endGame() {
      gameOver = true;
      finalScoreEl.textContent = score;
      finalHighEl.textContent = highScore;
      goalsTextEl.textContent = 'You scored ' + goals + ' goal' + (goals !== 1 ? 's' : '') + ' in a row!';
      resultTitleEl.textContent = goals >= 8 ? 'Legendary!' : goals >= 5 ? 'Amazing Run!' : goals >= 3 ? 'Great Session!' : 'Session Over';
      overlay.classList.remove('hidden');
    }

    function shoot() {
      if (phase !== 'power' && phase !== 'aim') return;
      phase = 'flying';
      ball.active = true;
      trail = [];
      const p = Math.max(0.2, power);

      if (shotType === 'blast') {
        const speed = (13 + p * 8) * scaleRatio;
        ball.vx = aimAngle * 5.2 * (0.7 + p);
        ball.vy = -speed;
        ball.spin = 0;
      } else if (shotType === 'chip') {
        const speed = (8 + p * 4.5) * scaleRatio;
        ball.vx = aimAngle * 3.2 * (0.6 + p);
        ball.vy = -speed * 1.5;
        ball.spin = 0;
      } else {
        const speed = (10.5 + p * 6) * scaleRatio;
        ball.vx = aimAngle * 3.6 * (0.65 + p);
        ball.vy = -speed;
        ball.spin = aimAngle * 0.3 * (0.8 + p);
      }

      // Keeper AI decision logic
      let dive = 0;
      const reactChance = 0.50 + Math.min(0.30, streak * 0.025);
      const difficultyMod = shotType === 'blast' ? -0.15 : (shotType === 'chip' ? 0.05 : 0);

      if (Math.abs(aimAngle) < 0.2) {
        dive = Math.random() < (reactChance + difficultyMod) ? (Math.random() < 0.5 ? -1 : 1) : 0;
      } else {
        dive = aimAngle > 0 ? 1 : -1;
        if (Math.random() < 0.25 + difficultyMod) dive = -dive;
        if (Math.random() < 0.15) dive = 0;
      }
      keeper.diveDir = dive;
      keeper.diving = true;
      keeper.diveProgress = 0;
    }

    function updateDefenders() {
      if (phase === 'flying' || phase === 'result') return;
      for (let d of defenders) {
        d.phase += 0.03 + (streak * 0.002);
        const amplitude = 22 + Math.min(14, streak * 1.5);
        d.x = d.baseX + Math.sin(d.phase) * amplitude;
        d.x = Math.max(goal.x - 10, Math.min(goal.x + goal.width + 10, d.x));
      }
    }

    function checkDefenderCollision() {
      if (!ball.active) return false;
      for (let d of defenders) {
        if (shotType === 'chip' && ball.y < d.y - 10) continue;
        const closestX = Math.max(d.x - d.width/2, Math.min(ball.x, d.x + d.width/2));
        const closestY = Math.max(d.y - 5, Math.min(ball.y, d.y + d.height));
        const dx = ball.x - closestX, dy = ball.y - closestY;
        if (Math.sqrt(dx*dx + dy*dy) < ball.radius + 4) return true;
      }
      return false;
    }

    function update() {
      if (gameOver) return;
      updateDefenders();
      if (phase === 'power' && charging) power = Math.min(power + 0.02, 1);

      if (phase === 'flying' && ball.active) {
        let grav = 0.28 * scaleRatio;
        if (shotType === 'chip') grav = 0.19 * scaleRatio;
        if (shotType === 'blast') grav = 0.32 * scaleRatio;

        ball.vy += grav;

        if (shotType === 'curve' && Math.abs(ball.spin) > 0.001) {
          ball.vx += ball.spin;
          ball.spin *= 0.978;
        }

        ball.vx *= 0.997;
        ball.x += ball.vx;
        ball.y += ball.vy;

        trail.push({ x: ball.x, y: ball.y, life: 1 });
        if (trail.length > 16) trail.shift();
        for (let t of trail) t.life -= 0.06;

        if (keeper.diving) {
          keeper.diveProgress = Math.min(keeper.diveProgress + 0.045, 1);
          keeper.x = (width / 2) + keeper.diveDir * ((goal.width * 0.38) * keeper.diveProgress);
        }

        if (checkDefenderCollision()) {
          ball.active = false; phase = 'result';
          message = 'BLOCKED!'; messageTimer = 80; resultTimer = 80;
          return;
        }

        if (ball.y < goal.y + goal.height + 10) {
          const inGoalX = ball.x > goal.x + 6 && ball.x < goal.x + goal.width - 6;
          const belowCrossbar = ball.y > goal.y + 4;
          const isTopCorner = ball.y < goal.y + (goal.height * 0.45);
          const isFarPost = (ball.x < goal.x + 40) || (ball.x > goal.x + goal.width - 40);
          const isPerfect = isTopCorner && isFarPost;

          const dx = ball.x - keeper.x, dy = ball.y - (keeper.y + 5);
          const saved = Math.sqrt(dx*dx + dy*dy) < 30 && keeper.diveProgress > 0.2;

          if (saved) {
            ball.active = false; phase = 'result';
            message = 'SAVED!'; messageTimer = 80; resultTimer = 80;
          } else if (inGoalX && belowCrossbar && ball.y < goal.y + goal.height) {
            ball.active = false; phase = 'result';
            const level = getCurrentLevel();
            let pts = level.points;
            if (isPerfect) pts = Math.round(pts * 1.8);
            if (shotType === 'chip' && isTopCorner) pts = Math.round(pts * 1.2);
            if (shotType === 'curve' && isFarPost) pts = Math.round(pts * 1.15);

            const mult = getMultiplier();
            const finalPts = Math.round(pts * mult);
            score += finalPts; goals++; streak++;
            scoreEl.textContent = score; streakEl.textContent = streak;
            updateMultiplierUI();
            if (score > highScore) {
              highScore = score;
              setStoredScore(highScore);
              highScoreEl.textContent = highScore;
            }
            if (isPerfect) message = 'PERFECT! +' + finalPts;
            else if (mult >= 2) message = 'GOAL! ×' + mult + ' +' + finalPts;
            else message = 'GOAL! +' + finalPts;
            messageTimer = 90; resultTimer = 80;
          } else if (ball.y < goal.y || ball.x < goal.x - 15 || ball.x > goal.x + goal.width + 15) {
            ball.active = false; phase = 'result';
            message = ball.y < goal.y ? 'OVER THE BAR!' : 'WIDE!';
            messageTimer = 80; resultTimer = 80;
          }
        }
        if (ball.y > height - 10) { ball.y = height - 10; ball.vy *= -0.3; }
      }

      if (phase === 'result') {
        resultTimer--;
        if (resultTimer <= 0) {
          if (message.includes('GOAL') || message.includes('PERFECT')) {
            resetForKick();
          } else {
            endGame();
          }
        }
      }
      if (messageTimer > 0) messageTimer--;
    }

    function drawPitch() {
      const g = ctx.createLinearGradient(0, 0, 0, height);
      g.addColorStop(0, '#15803d'); g.addColorStop(1, '#14532d');
      ctx.fillStyle = g; ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      const stripeH = height / 10;
      for (let i = 0; i < 10; i += 2) {
        ctx.fillRect(0, i * stripeH, width, stripeH);
      }

      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
      ctx.strokeRect(15, 15, width - 30, height - 25);

      const pWidth = goal.width + 60;
      const pHeight = height * 0.28;
      const pX = (width - pWidth) / 2;
      ctx.strokeRect(pX, 15, pWidth, pHeight);

      ctx.beginPath();
      ctx.arc(width / 2, 15 + pHeight * 0.6, 3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill();
    }

    function drawGoal() {
      ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
      const netRows = 6;
      const netCols = 10;
      for (let i = 0; i <= netCols; i++) {
        const x = goal.x + (i / netCols) * goal.width;
        ctx.beginPath(); ctx.moveTo(x, goal.y); ctx.lineTo(x, goal.y + goal.height); ctx.stroke();
      }
      for (let j = 0; j <= netRows; j++) {
        const y = goal.y + (j / netRows) * goal.height;
        ctx.beginPath(); ctx.moveTo(goal.x, y); ctx.lineTo(goal.x + goal.width, y); ctx.stroke();
      }

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(goal.x - 4, goal.y, 6, goal.height);
      ctx.fillRect(goal.x + goal.width - 2, goal.y, 6, goal.height);
      ctx.fillRect(goal.x - 4, goal.y - 2, goal.width + 8, 6);
    }

    function drawKeeper() {
      const kx = keeper.x, ky = keeper.y;
      ctx.fillStyle = '#ea580c';
      drawRoundRect(kx - 13, ky - 10, 26, 28, 5, true, false);

      ctx.fillStyle = '#fde047';
      ctx.beginPath(); ctx.arc(kx, ky - 16, 9, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = '#ea580c'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      const armSpread = 16 + keeper.diveProgress * 18;
      ctx.beginPath(); ctx.moveTo(kx - armSpread, ky - 2); ctx.lineTo(kx, ky - 4); ctx.lineTo(kx + armSpread, ky - 2); ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(kx - armSpread, ky - 2, 5, 0, Math.PI * 2); ctx.arc(kx + armSpread, ky - 2, 5, 0, Math.PI * 2); ctx.fill();
    }

    function drawDefenders() {
      for (let d of defenders) {
        ctx.fillStyle = '#2563eb';
        drawRoundRect(d.x - d.width/2, d.y, d.width, d.height - 8, 4, true, false);

        ctx.fillStyle = '#fde047';
        ctx.beginPath(); ctx.arc(d.x, d.y - 2, 8, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(d.x - 8, d.y + d.height - 8, 6, 8);
        ctx.fillRect(d.x + 2, d.y + d.height - 8, 6, 8);
      }
    }

    function drawTrail() {
      if (trail.length < 2) return;
      let color = '56, 189, 248';
      if (shotType === 'chip') color = '167, 139, 250';
      if (shotType === 'curve') color = '52, 211, 153';

      for (let i = 0; i < trail.length; i++) {
        const t = trail[i];
        if (t.life <= 0) continue;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 3 * t.life, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + color + ', ' + (t.life * 0.5) + ')';
        ctx.fill();
      }
    }

    function drawBall() {
      drawTrail();
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath(); ctx.ellipse(ball.x, ball.y + ball.radius + 1, ball.radius * 0.9, 3, 0, 0, Math.PI * 2); ctx.fill();

      const bg = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 0, ball.x, ball.y, ball.radius);
      bg.addColorStop(0, '#ffffff'); bg.addColorStop(0.7, '#e2e8f0'); bg.addColorStop(1, '#64748b');
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fillStyle = bg; ctx.fill();
      ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius * 0.5, 0, Math.PI * 2); ctx.stroke();
    }

    function drawAimAndPower() {
      if (phase === 'flying' || phase === 'result') return;

      let arrowColor = '#38bdf8';
      if (shotType === 'chip') arrowColor = '#a78bfa';
      if (shotType === 'curve') arrowColor = '#34d399';

      const ax = ball.x + aimAngle * (width * 0.22);
      const ay = ball.y - (60 * scaleRatio);

      ctx.strokeStyle = arrowColor; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ball.x, ball.y - 10); ctx.lineTo(ax, ay); ctx.stroke();

      if (shotType === 'curve' && Math.abs(aimAngle) > 0.1) {
        ctx.beginPath(); ctx.setLineDash([4, 4]);
        const curveDir = aimAngle > 0 ? 1 : -1;
        ctx.moveTo(ax, ay);
        ctx.quadraticCurveTo(ax + curveDir * 25, ay - 20, ax + curveDir * 40, ay - 5);
        ctx.stroke(); ctx.setLineDash([]);
      }

      ctx.fillStyle = arrowColor;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax - 6, ay + 10); ctx.lineTo(ax + 6, ay + 10); ctx.closePath(); ctx.fill();

      // Vertical Power Bar
      const barX = width - 20, barY = height * 0.35, barH = height * 0.3;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.6)'; ctx.fillRect(barX - 6, barY, 12, barH);
      ctx.strokeStyle = '#475569'; ctx.lineWidth = 1.5; ctx.strokeRect(barX - 6, barY, 12, barH);

      const fillH = power * barH;
      const grad = ctx.createLinearGradient(0, barY + barH, 0, barY);
      grad.addColorStop(0, '#22c55e'); grad.addColorStop(0.6, '#eab308'); grad.addColorStop(1, '#ef4444');
      ctx.fillStyle = grad; ctx.fillRect(barX - 5, barY + barH - fillH, 10, fillH);
    }

    function drawMessage() {
      if (messageTimer <= 0 || !message) return;
      ctx.save();
      ctx.globalAlpha = Math.min(1, messageTimer / 20);
      ctx.font = 'bold 22px system-ui, sans-serif'; ctx.textAlign = 'center';

      if (message.includes('PERFECT')) ctx.fillStyle = '#f472b6';
      else if (message.includes('GOAL')) ctx.fillStyle = '#4ade80';
      else if (message.includes('BLOCKED')) ctx.fillStyle = '#f97316';
      else ctx.fillStyle = '#f87171';

      ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 8;
      ctx.fillText(message, width / 2, height * 0.42);
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      drawPitch();
      drawGoal();
      drawDefenders();
      drawKeeper();
      drawBall();
      drawAimAndPower();
      drawMessage();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    // Touch & Pointer Handling
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function onStart(e) {
      if (gameOver || phase === 'flying' || phase === 'result') return;
      pointerDown = true;
      const p = getPos(e);
      lastX = p.x;
      lastY = p.y;

      if (phase === 'aim') {
        phase = 'power';
        charging = true;
        power = 0.1;
      }
    }

    function onMove(e) {
      if (!pointerDown || phase === 'flying' || phase === 'result') return;
      const p = getPos(e);
      const dx = p.x - lastX;
      aimAngle = Math.max(-1, Math.min(1, aimAngle + (dx / (width * 0.4))));
      lastX = p.x;
    }

    function onEnd() {
      if (!pointerDown) return;
      pointerDown = false;
      if (phase === 'power' && charging) {
        charging = false;
        shoot();
      }
    }

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(e); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onMove(e); }, { passive: false });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); onEnd(); }, { passive: false });
    canvas.addEventListener('mousedown', onStart);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onEnd);

    // Shot Selection Event Listeners
    shotBtns.blast.addEventListener('click', () => setShotType('blast'));
    shotBtns.chip.addEventListener('click', () => setShotType('chip'));
    shotBtns.curve.addEventListener('click', () => setShotType('curve'));

    // Restart & Share Action
    restartBtn.addEventListener('click', startGame);
    shareBtn.addEventListener('click', () => {
      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify({ score: highScore, type: 'free_kick_high_score' }));
      } else {
        navigator.clipboard?.writeText('My Cosmic Free Kicks High Score: ' + highScore);
      }
    });

    // Start Game
    startGame();
    loop();
  </script>
</body>
</html>
