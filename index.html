<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Cosmic Free Kicks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, #0a0f1a 0%, #1a2744 100%);
      color: #e8f0ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 4px;
      color: #7dd3fc;
      text-shadow: 0 0 12px rgba(125, 211, 252, 0.5);
      letter-spacing: 1px;
    }
    #ui {
      display: flex;
      gap: 12px;
      margin-bottom: 4px;
      font-size: 0.86rem;
      font-weight: 600;
      flex-wrap: wrap;
      justify-content: center;
    }
    #ui span { color: #fde68a; }
    #multiplier { color: #4ade80 !important; font-weight: 700; }
    #game-container {
      position: relative;
      border: 3px solid #334155;
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.25);
      background: #0f172a;
      overflow: hidden;
    }
    canvas { display: block; border-radius: 7px; }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 15, 30, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    #overlay.show { display: flex; }
    #overlay h2 { font-size: 1.6rem; color: #7dd3fc; margin-bottom: 10px; }
    #overlay p { font-size: 1.15rem; margin: 4px 0; color: #e2e8f0; }
    .btn {
      margin-top: 18px;
      padding: 12px 36px;
      font-size: 1.1rem;
      background: linear-gradient(90deg, #0ea5e9, #38bdf8);
      border: none;
      border-radius: 30px;
      color: #0f172a;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
    }
    .controls {
      margin-top: 6px;
      text-align: center;
      color: #94a3b8;
      font-size: 0.8rem;
      max-width: 360px;
      line-height: 1.3;
    }
    .kick-info {
      font-size: 0.84rem;
      color: #a5f3fc;
      margin-bottom: 3px;
      min-height: 18px;
    }
    #shot-select {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      justify-content: center;
      width: 100%;
      max-width: 380px;
      padding: 0 8px;
    }
    .shot-btn {
      flex: 1;
      padding: 12px 6px;
      font-size: 0.9rem;
      font-weight: 700;
      border: 2px solid #475569;
      border-radius: 14px;
      background: #1e293b;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      line-height: 1.3;
    }
    .shot-btn.active {
      border-color: #38bdf8;
      background: #0c4a6e;
      color: #7dd3fc;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
      transform: scale(1.03);
    }
    .shot-btn:active { transform: scale(0.97); }
    .shot-btn small {
      display: block;
      font-size: 0.7rem;
      font-weight: 500;
      opacity: 0.8;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <h1>⚽ COSMIC FREE KICKS</h1>
  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>High: <span id="highScore">0</span></div>
    <div>Streak: <span id="streak">0</span></div>
    <div>Mult: <span id="multiplier">×1</span></div>
  </div>
  <div class="kick-info" id="kickInfo">Close range — 50 pts • 1 Defender</div>

  <div id="game-container">
    <canvas id="canvas" width="380" height="560"></canvas>
    <div id="overlay">
      <h2 id="resultTitle">Game Over</h2>
      <p>Final Score: <span id="finalScore">0</span></p>
      <p>High Score: <span id="finalHigh">0</span></p>
      <p id="goalsText" style="margin-top:8px;color:#86efac;"></p>
      <button class="btn" id="restartBtn">Play Again</button>
    </div>
  </div>

  <div id="shot-select">
    <button class="shot-btn active" data-type="blast">
      💥 Blast
      <small>Power</small>
    </button>
    <button class="shot-btn" data-type="chip">
      🎈 Chip
      <small>Lob</small>
    </button>
    <button class="shot-btn" data-type="curve">
      🌀 Curve
      <small>Bend</small>
    </button>
  </div>

  <div class="controls">
    Tap Blast / Chip / Curve → Aim → Hold & release<br>
    Top corners = Perfect Bonus!
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const streakEl = document.getElementById('streak');
    const multiplierEl = document.getElementById('multiplier');
    const kickInfoEl = document.getElementById('kickInfo');
    const overlay = document.getElementById('overlay');
    const finalScoreEl = document.getElementById('finalScore');
    const finalHighEl = document.getElementById('finalHigh');
    const goalsTextEl = document.getElementById('goalsText');
    const resultTitleEl = document.getElementById('resultTitle');
    const restartBtn = document.getElementById('restartBtn');
    const shotBtns = document.querySelectorAll('.shot-btn');

    let highScore = parseInt(localStorage.getItem('cosmicFreeKickHigh') || '0');
    highScoreEl.textContent = highScore;

    let score = 0, streak = 0, goals = 0, gameOver = false;
    let phase = 'aim', power = 0, charging = false, aimAngle = 0;
    let resultTimer = 0, message = '', messageTimer = 0;
    let shotType = 'blast';

    const baseLevels = [
      { name: 'Close range',  points: 50,  ballY: 380, defenders: 1 },
      { name: 'Medium range', points: 80,  ballY: 420, defenders: 2 },
      { name: 'Long range',   points: 120, ballY: 460, defenders: 2 },
      { name: 'Far range',    points: 160, ballY: 500, defenders: 3 },
      { name: 'Extreme',      points: 200, ballY: 520, defenders: 3 }
    ];

    const ball = { x: 190, y: 380, vx: 0, vy: 0, radius: 9, active: false, spin: 0 };
    const keeper = { x: 190, y: 95, width: 36, height: 48, diveDir: 0, diveProgress: 0, diving: false };
    const goal = { x: 70, y: 40, width: 240, height: 70 };
    let defenders = [];
    let pointerDown = false, lastX = 0;

    function setShotType(type) {
      if (phase === 'flying' || phase === 'result' || gameOver) return;
      shotType = type;
      shotBtns.forEach(b => b.classList.toggle('active', b.dataset.type === type));
    }

    shotBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        setShotType(btn.dataset.type);
      });
      btn.addEventListener('touchend', (e) => {
        e.preventDefault();
        e.stopPropagation();
        setShotType(btn.dataset.type);
      }, { passive: false });
    });

    function getMultiplier() {
      if (streak >= 10) return 3;
      if (streak >= 6) return 2.5;
      if (streak >= 3) return 2;
      if (streak >= 1) return 1.5;
      return 1;
    }

    function updateMultiplierUI() {
      const m = getMultiplier();
      multiplierEl.textContent = '×' + m;
      if (m >= 2.5) multiplierEl.style.color = '#f472b6';
      else if (m >= 2) multiplierEl.style.color = '#4ade80';
      else if (m >= 1.5) multiplierEl.style.color = '#fde68a';
      else multiplierEl.style.color = '#94a3b8';
    }

    function getCurrentLevel() {
      const idx = Math.min(streak, baseLevels.length - 1);
      const level = { ...baseLevels[idx] };
      if (streak >= baseLevels.length) {
        const extra = streak - baseLevels.length + 1;
        level.defenders = Math.min(5, 3 + Math.floor(extra / 2));
        level.points = 200 + extra * 30;
        level.name = 'Extreme +' + extra;
        level.ballY = 520;
      }
      return level;
    }

    function createDefenders(count) {
      defenders = [];
      const wallY = 195;
      const spacing = count > 3 ? 32 : 38;
      const totalWidth = (count - 1) * spacing;
      const startXPos = 190 - totalWidth / 2;
      for (let i = 0; i < count; i++) {
        defenders.push({
          x: startXPos + i * spacing,
          y: wallY,
          baseX: startXPos + i * spacing,
          width: 22,
          height: 38,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function resetForKick() {
      const level = getCurrentLevel();
      ball.x = 190;
      ball.y = level.ballY;
      ball.vx = 0; ball.vy = 0; ball.active = false; ball.spin = 0;
      aimAngle = 0; power = 0; charging = false; phase = 'aim';
      keeper.x = 190; keeper.diveDir = 0; keeper.diveProgress = 0; keeper.diving = false;
      createDefenders(level.defenders);
      streakEl.textContent = streak;
      updateMultiplierUI();
      kickInfoEl.textContent = level.name + ' — ' + level.points + ' pts • ' + level.defenders + ' Defender' + (level.defenders > 1 ? 's' : '');
      message = '';
    }

    function startGame() {
      score = 0; streak = 0; goals = 0; gameOver = false;
      scoreEl.textContent = 0; streakEl.textContent = 0;
      updateMultiplierUI();
      overlay.classList.remove('show');
      setShotType('blast');
      resetForKick();
    }

    function endGame() {
      gameOver = true;
      finalScoreEl.textContent = score;
      finalHighEl.textContent = highScore;
      goalsTextEl.textContent = 'You scored ' + goals + ' goal' + (goals !== 1 ? 's' : '') + ' in a row!';
      resultTitleEl.textContent = goals >= 8 ? 'Legendary!' : goals >= 5 ? 'Amazing Run!' : goals >= 3 ? 'Great Session!' : 'Session Over';
      overlay.classList.add('show');
    }

    function shoot() {
      if (phase !== 'power' && phase !== 'aim') return;
      phase = 'flying';
      ball.active = true;
      const powerFactor = 0.5 + power * 0.95;

      if (shotType === 'blast') {
        const baseSpeed = 13.5 + power * 8;
        ball.vx = aimAngle * 5.8 * powerFactor;
        ball.vy = -baseSpeed * powerFactor;
        ball.spin = 0;
      } else if (shotType === 'chip') {
        const baseSpeed = 9.5 + power * 5.5;
        ball.vx = aimAngle * 4.2 * powerFactor;
        ball.vy = -baseSpeed * powerFactor * 1.25;
        ball.spin = 0;
      } else {
        const baseSpeed = 11.5 + power * 6.5;
        ball.vx = aimAngle * 4.5 * powerFactor;
        ball.vy = -baseSpeed * powerFactor;
        ball.spin = aimAngle * 0.18 * (0.7 + power);
      }

      const aimBias = aimAngle;
      let dive = 0;
      const reactChance = 0.52 + Math.min(0.28, streak * 0.025);
      const blastPenalty = shotType === 'blast' ? 0.12 : 0;

      if (Math.abs(aimBias) < 0.22) {
        dive = Math.random() < (reactChance - blastPenalty) ? (Math.random() < 0.5 ? -1 : 1) : 0;
      } else {
        dive = aimBias > 0 ? 1 : -1;
        if (Math.random() < 0.26 - Math.min(0.12, streak * 0.01)) dive = -dive;
        if (Math.random() < 0.15 + blastPenalty) dive = 0;
      }
      keeper.diveDir = dive;
      keeper.diving = true;
      keeper.diveProgress = 0;
    }

    function updateDefenders() {
      if (phase === 'flying' || phase === 'result') return;
      for (let d of defenders) {
        d.phase += 0.03 + (streak * 0.002);
        const amplitude = 26 + Math.min(14, streak * 1.5);
        d.x = d.baseX + Math.sin(d.phase) * amplitude;
        d.x = Math.max(90, Math.min(290, d.x));
      }
    }

    function checkDefenderCollision() {
      if (!ball.active) return false;
      for (let d of defenders) {
        if (shotType === 'chip' && ball.y < d.y - 8) continue;
        const closestX = Math.max(d.x - d.width/2, Math.min(ball.x, d.x + d.width/2));
        const closestY = Math.max(d.y - 5, Math.min(ball.y, d.y + d.height));
        const dx = ball.x - closestX, dy = ball.y - closestY;
        if (Math.sqrt(dx*dx + dy*dy) < ball.radius + 4) return true;
      }
      return false;
    }

    function update() {
      if (gameOver) return;
      updateDefenders();
      if (phase === 'power' && charging) power = Math.min(power + 0.018, 1);

      if (phase === 'flying' && ball.active) {
        const grav = shotType === 'chip' ? 0.22 : 0.28;
        ball.vy += grav;
        if (shotType === 'curve' && ball.spin !== 0) {
          ball.vx += ball.spin;
          ball.spin *= 0.985;
        }
        ball.vx *= 0.996;
        ball.x += ball.vx;
        ball.y += ball.vy;

        if (keeper.diving) {
          keeper.diveProgress = Math.min(keeper.diveProgress + 0.045, 1);
          keeper.x = 190 + keeper.diveDir * (78 * keeper.diveProgress);
        }

        if (checkDefenderCollision()) {
          ball.active = false; phase = 'result';
          message = 'BLOCKED!'; messageTimer = 90; resultTimer = 90;
          return;
        }

        if (ball.y < 85) {
          const inGoalX = ball.x > goal.x + 8 && ball.x < goal.x + goal.width - 8;
          const belowCrossbar = ball.y > goal.y + 5;
          const isTopCorner = ball.y < goal.y + 28;
          const isFarPost = (ball.x < goal.x + 45) || (ball.x > goal.x + goal.width - 45);
          const isPerfect = isTopCorner && isFarPost;
          const dx = ball.x - keeper.x, dy = ball.y - (keeper.y + 10);
          const saved = Math.sqrt(dx*dx + dy*dy) < 32 && keeper.diveProgress > 0.25;

          if (saved) {
            ball.active = false; phase = 'result';
            message = 'SAVED!'; messageTimer = 90; resultTimer = 90;
          } else if (inGoalX && belowCrossbar && ball.y < 95) {
            ball.active = false; phase = 'result';
            const level = getCurrentLevel();
            let pts = level.points;
            if (isPerfect) pts = Math.round(pts * 1.8);
            if (shotType === 'chip' && isTopCorner) pts = Math.round(pts * 1.15);
            if (shotType === 'curve' && isFarPost) pts = Math.round(pts * 1.1);
            const mult = getMultiplier();
            const finalPts = Math.round(pts * mult);
            score += finalPts; goals++; streak++;
            scoreEl.textContent = score; streakEl.textContent = streak;
            updateMultiplierUI();
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('cosmicFreeKickHigh', highScore);
              highScoreEl.textContent = highScore;
            }
            if (isPerfect) message = 'PERFECT! +' + finalPts;
            else if (mult >= 2) message = 'GOAL! ×' + mult + ' +' + finalPts;
            else message = 'GOAL! +' + finalPts;
            if (streak === 5) message = '5 STREAK! +' + finalPts;
            if (streak === 10) message = '10 STREAK!! +' + finalPts;
            if (streak === 15) message = 'UNSTOPPABLE! +' + finalPts;
            messageTimer = 100; resultTimer = 85;
          } else if (ball.y < 30 || ball.x < 20 || ball.x > 360) {
            ball.active = false; phase = 'result';
            message = ball.y < 30 ? 'OVER THE BAR!' : 'WIDE!';
            messageTimer = 90; resultTimer = 90;
          }
        }
        if (ball.y > 540) { ball.y = 540; ball.vy *= -0.4; ball.vx *= 0.8; }
      }

      if (phase === 'result') {
        resultTimer--;
        if (resultTimer <= 0) {
          if (message.includes('GOAL') || message.includes('PERFECT') || message.includes('STREAK') || message.includes('UNSTOPPABLE')) {
            resetForKick();
          } else {
            endGame();
          }
        }
      }
      if (messageTimer > 0) messageTimer--;
    }

    function drawPitch() {
      const g = ctx.createLinearGradient(0, 0, 0, 560);
      g.addColorStop(0, '#166534'); g.addColorStop(1, '#14532d');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 380, 560);
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      for (let i = 0; i < 12; i++) if (i % 2 === 0) ctx.fillRect(0, i * 48, 380, 48);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
      ctx.strokeRect(25, 25, 330, 510);
      ctx.strokeRect(80, 25, 220, 110);
      ctx.strokeRect(120, 25, 140, 50);
      ctx.beginPath(); ctx.arc(190, 120, 3, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
      ctx.beginPath(); ctx.arc(190, 280, 55, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(25, 280); ctx.lineTo(355, 280); ctx.stroke();
    }

    function drawGoal() {
      ctx.fillStyle = '#f1f5f9';
      ctx.fillRect(goal.x - 4, goal.y, 6, goal.height + 8);
      ctx.fillRect(goal.x + goal.width - 2, goal.y, 6, goal.height + 8);
      ctx.fillRect(goal.x - 4, goal.y, goal.width + 8, 6);
      ctx.fillStyle = 'rgba(125, 211, 252, 0.13)';
      ctx.fillRect(goal.x + 6, goal.y + 6, 38, 24);
      ctx.fillRect(goal.x + goal.width - 44, goal.y + 6, 38, 24);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
      for (let i = 0; i <= 8; i++) {
        const x = goal.x + (i / 8) * goal.width;
        ctx.beginPath(); ctx.moveTo(x, goal.y + 6); ctx.lineTo(x - 8 + i*2, goal.y + goal.height); ctx.stroke();
      }
      for (let j = 1; j < 5; j++) {
        const y = goal.y + 6 + (j / 5) * goal.height;
        ctx.beginPath(); ctx.moveTo(goal.x, y); ctx.lineTo(goal.x + goal.width, y); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(goal.x, goal.y + 6, goal.width, goal.height - 2);
    }

    function drawKeeper() {
      const kx = keeper.x, ky = keeper.y;
      ctx.fillStyle = '#e11d48';
      ctx.beginPath(); ctx.roundRect(kx - 14, ky + 8, 28, 32, 6); ctx.fill();
      ctx.fillStyle = '#fcd34d';
      ctx.beginPath(); ctx.arc(kx, ky + 4, 11, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#e11d48'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      const armSpread = 18 + keeper.diveProgress * 22;
      ctx.beginPath(); ctx.moveTo(kx - armSpread, ky + 18); ctx.lineTo(kx, ky + 16); ctx.lineTo(kx + armSpread, ky + 18); ctx.stroke();
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath(); ctx.arc(kx - armSpread, ky + 18, 6, 0, Math.PI * 2); ctx.arc(kx + armSpread, ky + 18, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(kx - 12, ky + 38, 9, 16); ctx.fillRect(kx + 3, ky + 38, 9, 16);
    }

    function drawDefenders() {
      for (let d of defenders) {
        ctx.fillStyle = '#1d4ed8';
        ctx.beginPath(); ctx.roundRect(d.x - d.width/2, d.y, d.width, d.height - 10, 5); ctx.fill();
        ctx.fillStyle = '#fcd34d';
        ctx.beginPath(); ctx.arc(d.x, d.y - 2, 9, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#1d4ed8'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(d.x - 14, d.y + 12); ctx.lineTo(d.x, d.y + 10); ctx.lineTo(d.x + 14, d.y + 12); ctx.stroke();
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(d.x - 9, d.y + d.height - 12, 7, 12); ctx.fillRect(d.x + 2, d.y + d.height - 12, 7, 12);
      }
    }

    function drawBall() {
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath(); ctx.ellipse(ball.x, ball.y + ball.radius + 2, ball.radius * 0.9, 4, 0, 0, Math.PI * 2); ctx.fill();
      const bg = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 0, ball.x, ball.y, ball.radius);
      bg.addColorStop(0, '#ffffff'); bg.addColorStop(0.7, '#e2e8f0'); bg.addColorStop(1, '#94a3b8');
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fillStyle = bg; ctx.fill();
      ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius * 0.55, 0, Math.PI * 2); ctx.stroke();
    }

    function drawAimAndPower() {
      if (phase === 'flying' || phase === 'result') return;
      let arrowColor = '#38bdf8';
      if (shotType === 'chip') arrowColor = '#a78bfa';
      if (shotType === 'curve') arrowColor = '#34d399';

      const ax = ball.x + aimAngle * 70;
      const ay = ball.y - 50;
      ctx.strokeStyle = arrowColor; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ball.x, ball.y - 12); ctx.lineTo(ax, ay); ctx.stroke();

      if (shotType === 'curve' && Math.abs(aimAngle) > 0.15) {
        ctx.beginPath(); ctx.setLineDash([4, 4]);
        const curveDir = aimAngle > 0 ? 1 : -1;
        ctx.moveTo(ax, ay);
        ctx.quadraticCurveTo(ax + curveDir * 25, ay - 20, ax + curveDir * 40, ay - 5);
        ctx.stroke(); ctx.setLineDash([]);
      }

      ctx.fillStyle = arrowColor;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax - 7 - aimAngle * 4, ay + 12); ctx.lineTo(ax + 7 - aimAngle * 4, ay + 12); ctx.closePath(); ctx.fill();

      const barX = 350, barY = 200, barH = 160;
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(barX - 8, barY, 16, barH);
      ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2; ctx.strokeRect(barX - 8, barY, 16, barH);
      const fillH = power * barH;
      const grad = ctx.createLinearGradient(0, barY + barH, 0, barY);
      grad.addColorStop(0, '#22c55e'); grad.addColorStop(0.6, '#eab308'); grad.addColorStop(1, '#ef4444');
      ctx.fillStyle = grad; ctx.fillRect(barX - 6, barY + barH - fillH, 12, fillH);
      ctx.fillStyle = '#94a3b8'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('PWR', barX, barY + barH + 16);

      ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = arrowColor;
      const label = shotType === 'blast' ? 'BLAST' : shotType === 'chip' ? 'CHIP' : 'CURVE';
      ctx.fillText(label, ball.x, ball.y + 28);
    }

    function drawMessage() {
      if (messageTimer <= 0 || !message) return;
      ctx.save();
      ctx.globalAlpha = Math.min(1, messageTimer / 20);
      ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
      if (message.includes('PERFECT') || message.includes('UNSTOPPABLE')) ctx.fillStyle = '#f472b6';
      else if (message.includes('GOAL') || message.includes('STREAK')) ctx.fillStyle = '#4ade80';
      else if (message.includes('BLOCKED')) ctx.fillStyle = '#f97316';
      else ctx.fillStyle = '#f87171';
      ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 10;
      ctx.fillText(message, 190, 255);
      ctx.restore();
    }

    function draw() {
      drawPitch(); drawGoal(); drawDefenders(); drawKeeper(); drawBall(); drawAimAndPower(); drawMessage();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      return { x: (clientX - rect.left) * (canvas.width / rect.width) };
    }

    function onStart(e) {
      if (gameOver || phase === 'flying' || phase === 'result') return;
      e.preventDefault();
      pointerDown = true;
      lastX = getPos(e).x;
      if (phase === 'aim') { phase = 'power'; charging = true; power = 0.15; }
    }

    function onMove(e) {
      if (!pointerDown || phase === 'flying' || phase === 'result') return;
      e.preventDefault();
      const p = getPos(e);
      aimAngle = Math.max(-1, Math.min(1, aimAngle + (p.x - lastX) * 0.012));
      lastX = p.x;
    }

    function onEnd(e) {
      if (!pointerDown) return;
      e.preventDefault();
      pointerDown = false;
      if (phase === 'power' && charging) { charging = false; shoot(); }
    }

    canvas.addEventListener('touchstart', onStart, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onEnd, { passive: false });
    canvas.addEventListener('touchcancel', onEnd, { passive: false });
    canvas.addEventListener('mousedown', onStart);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onEnd);
    canvas.addEventListener('mouseleave', onEnd);

    document.addEventListener('keydown', e => {
      if (gameOver) return;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') aimAngle = Math.max(-1, aimAngle - 0.08);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') aimAngle = Math.min(1, aimAngle + 0.08);
      if ((e.code === 'Space' || e.code === 'ArrowUp') && phase === 'aim') {
        e.preventDefault(); phase = 'power'; charging = true; power = 0.15;
      }
      if (e.code === 'Digit1') setShotType('blast');
      if (e.code === 'Digit2') setShotType('chip');
      if (e.code === 'Digit3') setShotType('curve');
    });

    document.addEventListener('keyup', e => {
      if ((e.code === 'Space' || e.code === 'ArrowUp') && phase === 'power' && charging) {
        e.preventDefault(); charging = false; shoot();
      }
    });

    restartBtn.addEventListener('click', startGame);
    startGame();
    loop();
  </script>
</body>
</html>
