<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Cosmic Free Kicks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0f1a;
      color: #e8f0ff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
      user-select: none;
      overflow: hidden;
    }
    .text-glow {
      text-shadow: 0 0 12px rgba(125, 211, 252, 0.6);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center p-2 select-none overflow-hidden bg-slate-950 text-slate-100">

  <!-- TOP HEADER & STATS -->
  <header class="w-full max-w-md flex flex-col items-center gap-1 py-1 z-10 shrink-0">
    <div class="w-full flex justify-between items-center px-2">
      <h1 class="text-base font-bold text-sky-400 text-glow flex items-center gap-1">
        ⚽ COSMIC FREE KICKS
      </h1>
      <button id="leaderboardBtn" class="bg-slate-800 hover:bg-slate-700 text-sky-300 border border-sky-500/30 px-2.5 py-1 rounded-full text-xs font-semibold flex items-center gap-1 shadow-sm transition active:scale-95">
        🏆 Board
      </button>
    </div>

    <div class="w-full flex justify-between items-center px-3 py-1 bg-slate-900/90 border border-slate-800 rounded-xl text-xs font-semibold shadow-inner">
      <div>Score: <span id="score" class="text-amber-300 font-bold">0</span></div>
      <div>High: <span id="highScore" class="text-amber-300 font-bold">0</span></div>
      <div>Streak: <span id="streak" class="text-amber-300 font-bold">0</span></div>
      <div>Mult: <span id="multiplier" class="text-emerald-400 font-extrabold">×1</span></div>
    </div>

    <div class="text-[11px] text-cyan-200/80 font-medium" id="kickInfo">
      Close range — 50 pts • 1 Defender
    </div>
  </header>

  <!-- GAME CANVAS CONTAINER -->
  <main id="gameContainer" class="relative w-full max-w-md flex-1 my-1 border-2 border-slate-700/80 rounded-2xl shadow-[0_0_25px_rgba(56,189,248,0.15)] bg-slate-900 overflow-hidden flex items-center justify-center">
    <canvas id="canvas" class="block w-full h-full rounded-xl"></canvas>

    <!-- GAME OVER / SUBMIT SCORE OVERLAY -->
    <div id="overlay" class="absolute inset-0 bg-slate-950/95 hidden flex-col items-center justify-center p-5 z-20 text-center backdrop-blur-md">
      <h2 id="resultTitle" class="text-2xl font-black text-sky-400 text-glow mb-1">Session Over</h2>
      
      <p class="text-sm text-slate-300">Final Score: <span id="finalScore" class="text-amber-300 font-bold">0</span></p>
      <p class="text-sm text-slate-300">High Score: <span id="finalHigh" class="text-amber-300 font-bold">0</span></p>
      <p id="goalsText" class="text-xs font-semibold text-emerald-400 mt-1 mb-3"></p>

      <!-- NAME INPUT / LEADERBOARD SUBMIT -->
      <div class="w-full max-w-xs bg-slate-900/80 p-3 rounded-xl border border-slate-800 mb-4 flex flex-col gap-2 shadow-md">
        <label for="playerNameInput" class="text-[11px] text-slate-400 font-medium text-left">Your Player Handle:</label>
        <div class="flex gap-2">
          <input type="text" id="playerNameInput" maxlength="16" placeholder="Enter name..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-sky-400">
          <button id="submitScoreBtn" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs transition active:scale-95 shadow">
            Save
          </button>
        </div>
        <p id="submitStatus" class="text-[10px] text-emerald-400 font-medium hidden">Score saved to leaderboard!</p>
      </div>

      <div class="flex flex-col gap-2 w-full max-w-xs">
        <button id="restartBtn" class="w-full py-2.5 rounded-full text-sm font-extrabold bg-gradient-to-r from-sky-500 to-blue-600 text-slate-950 shadow-lg hover:brightness-110 active:scale-95 transition">
          Play Again ⚽
        </button>
        <button id="shareBtn" class="w-full py-2 rounded-full text-xs font-bold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sky-300 transition active:scale-95">
          Share High Score 🚀
        </button>
      </div>
    </div>

    <!-- GLOBAL LEADERBOARD MODAL -->
    <div id="leaderboardModal" class="absolute inset-0 bg-slate-950/95 hidden flex-col items-center p-4 z-30 backdrop-blur-md">
      <div class="w-full flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
        <h3 class="text-base font-bold text-amber-300 flex items-center gap-1">🏆 Global Top 10</h3>
        <button id="closeLeaderboardBtn" class="text-slate-400 hover:text-slate-100 text-sm font-bold bg-slate-800 px-2 py-0.5 rounded-full">✕</button>
      </div>
      
      <div id="leaderboardList" class="w-full flex-1 overflow-y-auto flex flex-col gap-1.5 pr-1">
        <div class="text-xs text-slate-500 text-center py-6">Loading rankings...</div>
      </div>
    </div>
  </main>

  <!-- BOTTOM SHOT SELECTOR BUTTONS -->
  <footer class="w-full max-w-md grid grid-cols-3 gap-2 py-1 z-10 shrink-0">
    <button id="btnBlast" class="py-2 bg-sky-950/80 border-2 border-sky-400 rounded-xl text-sky-300 font-bold text-xs shadow transition active:scale-95 flex items-center justify-center gap-1">
      🚀 BLAST
    </button>
    <button id="btnChip" class="py-2 bg-slate-900 border border-slate-700 rounded-xl text-slate-400 font-semibold text-xs transition active:scale-95 flex items-center justify-center gap-1">
      🎈 CHIP
    </button>
    <button id="btnCurve" class="py-2 bg-slate-900 border border-slate-700 rounded-xl text-slate-400 font-semibold text-xs transition active:scale-95 flex items-center justify-center gap-1">
      🌀 CURVE
    </button>
  </footer>

  <script>
    // --- Telegram WebApp Integration ---
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // --- Render Backend API URL ---
    const RENDER_API_URL = 'https://freekicks-leaderboard.onrender.com/api/leaderboard';

    // --- DOM Elements ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const streakEl = document.getElementById('streak');
    const multiplierEl = document.getElementById('multiplier');
    const kickInfoEl = document.getElementById('kickInfo');
    const overlay = document.getElementById('overlay');
    const finalScoreEl = document.getElementById('finalScore');
    const finalHighEl = document.getElementById('finalHigh');
    const goalsTextEl = document.getElementById('goalsText');
    const resultTitleEl = document.getElementById('resultTitle');
    const restartBtn = document.getElementById('restartBtn');
    const shareBtn = document.getElementById('shareBtn');
    const leaderboardBtn = document.getElementById('leaderboardBtn');
    const leaderboardModal = document.getElementById('leaderboardModal');
    const closeLeaderboardBtn = document.getElementById('closeLeaderboardBtn');
    const leaderboardList = document.getElementById('leaderboardList');
    const playerNameInput = document.getElementById('playerNameInput');
    const submitScoreBtn = document.getElementById('submitScoreBtn');
    const submitStatus = document.getElementById('submitStatus');

    const btnBlast = document.getElementById('btnBlast');
    const btnChip = document.getElementById('btnChip');
    const btnCurve = document.getElementById('btnCurve');

    // --- Auto Detect Telegram User Name ---
    let defaultPlayerName = tg?.initDataUnsafe?.user?.username || 
                            tg?.initDataUnsafe?.user?.first_name || 
                            localStorage.getItem('cosmicPlayerName') || 
                            'Striker';
    playerNameInput.value = defaultPlayerName;

    // --- High Score Management ---
    let highScore = parseInt(localStorage.getItem('cosmicFreeKickHigh') || '0');
    highScoreEl.textContent = highScore;

    // --- Game Variables ---
    let score = 0, streak = 0, goals = 0, gameOver = false;
    let phase = 'aim', power = 0, charging = false, aimAngle = 0;
    let resultTimer = 0, message = '', messageTimer = 0;
    let shotType = 'blast';
    let trail = [];

    const baseLevels = [
      { name: 'Close range',  points: 50,  ballY: 370, defenders: 1 },
      { name: 'Medium range', points: 80,  ballY: 410, defenders: 2 },
      { name: 'Long range',   points: 120, ballY: 450, defenders: 2 },
      { name: 'Far range',    points: 160, ballY: 490, defenders: 3 },
      { name: 'Extreme',      points: 200, ballY: 510, defenders: 3 }
    ];

    const ball = { x: 190, y: 370, vx: 0, vy: 0, radius: 9, active: false, spin: 0 };
    const keeper = { x: 190, y: 95, width: 36, height: 48, diveDir: 0, diveProgress: 0, diving: false };
    const goal = { x: 70, y: 40, width: 240, height: 70 };
    let defenders = [];
    let pointerDown = false, lastX = 0;

    // --- Canvas Resizing System ---
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * (window.devicePixelRatio || 1);
      canvas.height = rect.height * (window.devicePixelRatio || 1);
      ctx.scale(canvas.width / 380, canvas.height / 580);
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 50);

    // Safe Rounded Rect Helper
    function roundRect(x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function setShotType(type) {
      if (phase === 'flying' || phase === 'result' || gameOver) return;
      shotType = type;
      [btnBlast, btnChip, btnCurve].forEach(b => {
        b.className = 'py-2 bg-slate-900 border border-slate-700 rounded-xl text-slate-400 font-semibold text-xs transition active:scale-95 flex items-center justify-center gap-1';
      });
      if (type === 'blast') btnBlast.className = 'py-2 bg-sky-950/80 border-2 border-sky-400 rounded-xl text-sky-300 font-bold text-xs shadow transition active:scale-95 flex items-center justify-center gap-1';
      if (type === 'chip')  btnChip.className = 'py-2 bg-purple-950/80 border-2 border-purple-400 rounded-xl text-purple-300 font-bold text-xs shadow transition active:scale-95 flex items-center justify-center gap-1';
      if (type === 'curve') btnCurve.className = 'py-2 bg-emerald-950/80 border-2 border-emerald-400 rounded-xl text-emerald-300 font-bold text-xs shadow transition active:scale-95 flex items-center justify-center gap-1';
    }

    function getMultiplier() {
      if (streak >= 10) return 3;
      if (streak >= 6) return 2.5;
      if (streak >= 3) return 2;
      if (streak >= 1) return 1.5;
      return 1;
    }

    function updateMultiplierUI() {
      const m = getMultiplier();
      multiplierEl.textContent = '×' + m;
      if (m >= 2.5) multiplierEl.style.color = '#f472b6';
      else if (m >= 2) multiplierEl.style.color = '#4ade80';
      else if (m >= 1.5) multiplierEl.style.color = '#fde68a';
      else multiplierEl.style.color = '#94a3b8';
    }

    function getCurrentLevel() {
      const idx = Math.min(streak, baseLevels.length - 1);
      const level = Object.assign({}, baseLevels[idx]);
      if (streak >= baseLevels.length) {
        const extra = streak - baseLevels.length + 1;
        level.defenders = Math.min(5, 3 + Math.floor(extra / 2));
        level.points = 200 + extra * 30;
        level.name = 'Extreme +' + extra;
        level.ballY = 510;
      }
      return level;
    }

    function createDefenders(count) {
      defenders = [];
      const wallY = 195;
      const spacing = count > 3 ? 32 : 38;
      const totalWidth = (count - 1) * spacing;
      const startXPos = 190 - totalWidth / 2;
      for (let i = 0; i < count; i++) {
        defenders.push({
          x: startXPos + i * spacing,
          y: wallY,
          baseX: startXPos + i * spacing,
          width: 22,
          height: 38,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function resetForKick() {
      const level = getCurrentLevel();
      ball.x = 190;
      ball.y = level.ballY;
      ball.vx = 0; ball.vy = 0; ball.active = false; ball.spin = 0;
      aimAngle = 0; power = 0; charging = false; phase = 'aim';
      keeper.x = 190; keeper.diveDir = 0; keeper.diveProgress = 0; keeper.diving = false;
      trail = [];
      createDefenders(level.defenders);
      streakEl.textContent = streak;
      updateMultiplierUI();
      kickInfoEl.textContent = level.name + ' — ' + level.points + ' pts • ' + level.defenders + ' Defender' + (level.defenders > 1 ? 's' : '');
      message = '';
    }

    function startGame() {
      score = 0; streak = 0; goals = 0; gameOver = false;
      scoreEl.textContent = 0; streakEl.textContent = 0;
      updateMultiplierUI();
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
      submitStatus.classList.add('hidden');
      setShotType('blast');
      resetForKick();
    }

    function endGame() {
      gameOver = true;
      finalScoreEl.textContent = score;
      finalHighEl.textContent = highScore;
      goalsTextEl.textContent = 'You scored ' + goals + ' goal' + (goals !== 1 ? 's' : '') + ' in a row!';
      resultTitleEl.textContent = goals >= 8 ? 'Legendary!' : goals >= 5 ? 'Amazing Run!' : goals >= 3 ? 'Great Session!' : 'Session Over';
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function shoot() {
      if (phase !== 'power' && phase !== 'aim') return;
      phase = 'flying';
      ball.active = true;
      trail = [];
      const p = Math.max(0.2, power);

      if (shotType === 'blast') {
        const speed = 14 + p * 9;
        ball.vx = aimAngle * 5.2 * (0.7 + p);
        ball.vy = -speed;
        ball.spin = 0;
      } else if (shotType === 'chip') {
        const speed = 8.5 + p * 5;
        ball.vx = aimAngle * 3.4 * (0.6 + p);
        ball.vy = -speed * 1.55;
        ball.spin = 0;
      } else {
        const speed = 11 + p * 6.5;
        ball.vx = aimAngle * 3.8 * (0.65 + p);
        ball.vy = -speed;
        ball.spin = aimAngle * 0.32 * (0.8 + p);
      }

      const aimBias = aimAngle;
      let dive = 0;
      const reactChance = 0.50 + Math.min(0.30, streak * 0.025);
      const difficultyMod = shotType === 'blast' ? -0.15 : (shotType === 'chip' ? 0.05 : 0);

      if (Math.abs(aimBias) < 0.2) {
        dive = Math.random() < (reactChance + difficultyMod) ? (Math.random() < 0.5 ? -1 : 1) : 0;
      } else {
        dive = aimBias > 0 ? 1 : -1;
        if (Math.random() < 0.28 + difficultyMod) dive = -dive;
        if (Math.random() < 0.16) dive = 0;
      }
      keeper.diveDir = dive;
      keeper.diving = true;
      keeper.diveProgress = 0;
    }

    function updateDefenders() {
      if (phase === 'flying' || phase === 'result') return;
      for (let d of defenders) {
        d.phase += 0.03 + (streak * 0.002);
        const amplitude = 26 + Math.min(14, streak * 1.5);
        d.x = d.baseX + Math.sin(d.phase) * amplitude;
        d.x = Math.max(90, Math.min(290, d.x));
      }
    }

    function checkDefenderCollision() {
      if (!ball.active) return false;
      for (let d of defenders) {
        if (shotType === 'chip' && ball.y < d.y - 12) continue;
        const closestX = Math.max(d.x - d.width/2, Math.min(ball.x, d.x + d.width/2));
        const closestY = Math.max(d.y - 5, Math.min(ball.y, d.y + d.height));
        const dx = ball.x - closestX, dy = ball.y - closestY;
        if (Math.sqrt(dx*dx + dy*dy) < ball.radius + 4) return true;
      }
      return false;
    }

    function update() {
      if (gameOver) return;
      updateDefenders();
      if (phase === 'power' && charging) power = Math.min(power + 0.018, 1);

      if (phase === 'flying' && ball.active) {
        let grav = 0.29;
        if (shotType === 'chip') grav = 0.195;
        if (shotType === 'blast') grav = 0.33;

        ball.vy += grav;

        if (shotType === 'curve' && Math.abs(ball.spin) > 0.001) {
          ball.vx += ball.spin;
          ball.spin *= 0.978;
        }

        ball.vx *= 0.997;
        ball.x += ball.vx;
        ball.y += ball.vy;

        trail.push({ x: ball.x, y: ball.y, life: 1 });
        if (trail.length > 18) trail.shift();
        for (let t of trail) t.life -= 0.055;

        if (keeper.diving) {
          keeper.diveProgress = Math.min(keeper.diveProgress + 0.045, 1);
          keeper.x = 190 + keeper.diveDir * (78 * keeper.diveProgress);
        }

        if (checkDefenderCollision()) {
          ball.active = false; phase = 'result';
          message = 'BLOCKED!'; messageTimer = 90; resultTimer = 90;
          return;
        }

        if (ball.y < 85) {
          const inGoalX = ball.x > goal.x + 8 && ball.x < goal.x + goal.width - 8;
          const belowCrossbar = ball.y > goal.y + 5;
          const isTopCorner = ball.y < goal.y + 28;
          const isFarPost = (ball.x < goal.x + 48) || (ball.x > goal.x + goal.width - 48);
          const isPerfect = isTopCorner && isFarPost;
          const dx = ball.x - keeper.x, dy = ball.y - (keeper.y + 10);
          const saved = Math.sqrt(dx*dx + dy*dy) < 32 && keeper.diveProgress > 0.25;

          if (saved) {
            ball.active = false; phase = 'result';
            message = 'SAVED!'; messageTimer = 90; resultTimer = 90;
          } else if (inGoalX && belowCrossbar && ball.y < 95) {
            ball.active = false; phase = 'result';
            const level = getCurrentLevel();
            let pts = level.points;
            if (isPerfect) pts = Math.round(pts * 1.8);
            if (shotType === 'chip' && isTopCorner) pts = Math.round(pts * 1.2);
            if (shotType === 'curve' && isFarPost) pts = Math.round(pts * 1.15);
            if (shotType === 'blast' && !isPerfect) pts = Math.round(pts * 1.05);

            const mult = getMultiplier();
            const finalPts = Math.round(pts * mult);
            score += finalPts; goals++; streak++;
            scoreEl.textContent = score; streakEl.textContent = streak;
            updateMultiplierUI();
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('cosmicFreeKickHigh', highScore);
              highScoreEl.textContent = highScore;
            }
            if (isPerfect) message = 'PERFECT! +' + finalPts;
            else if (mult >= 2) message = 'GOAL! ×' + mult + ' +' + finalPts;
            else message = 'GOAL! +' + finalPts;
            if (streak === 5) message = '5 STREAK! +' + finalPts;
            if (streak === 10) message = '10 STREAK!! +' + finalPts;
            if (streak === 15) message = 'UNSTOPPABLE! +' + finalPts;
            messageTimer = 100; resultTimer = 85;
          } else if (ball.y < 30 || ball.x < 15 || ball.x > 365) {
            ball.active = false; phase = 'result';
            message = ball.y < 30 ? 'OVER THE BAR!' : 'WIDE!';
            messageTimer = 90; resultTimer = 90;
          }
        }
        if (ball.y > 520) { ball.y = 520; ball.vy *= -0.4; ball.vx *= 0.8; }
      }

      if (phase === 'result') {
        resultTimer--;
        if (resultTimer <= 0) {
          if (message.indexOf('GOAL') !== -1 || message.indexOf('PERFECT') !== -1 || message.indexOf('STREAK') !== -1 || message.indexOf('UNSTOPPABLE') !== -1) {
            resetForKick();
          } else {
            endGame();
          }
        }
      }
      if (messageTimer > 0) messageTimer--;
    }

    function drawPitch() {
      const g = ctx.createLinearGradient(0, 0, 0, 580);
      g.addColorStop(0, '#166534'); g.addColorStop(1, '#14532d');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 380, 580);
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      for (let i = 0; i < 12; i++) if (i % 2 === 0) ctx.fillRect(0, i * 48, 380, 48);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
      ctx.strokeRect(25, 25, 330, 490);
      ctx.strokeRect(80, 25, 220, 110);
      ctx.strokeRect(120, 25, 140, 50);
      ctx.beginPath(); ctx.arc(190, 120, 3, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
      ctx.beginPath(); ctx.arc(190, 280, 55, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(25, 280); ctx.lineTo(355, 280); ctx.stroke();
    }

    function drawGoal() {
      ctx.fillStyle = '#f1f5f9';
      ctx.fillRect(goal.x - 4, goal.y, 6, goal.height + 8);
      ctx.fillRect(goal.x + goal.width - 2, goal.y, 6, goal.height + 8);
      ctx.fillRect(goal.x - 4, goal.y, goal.width + 8, 6);
      ctx.fillStyle = 'rgba(125, 211, 252, 0.13)';
      ctx.fillRect(goal.x + 6, goal.y + 6, 38, 24);
      ctx.fillRect(goal.x + goal.width - 44, goal.y + 6, 38, 24);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
      for (let i = 0; i <= 8; i++) {
        const x = goal.x + (i / 8) * goal.width;
        ctx.beginPath(); ctx.moveTo(x, goal.y + 6); ctx.lineTo(x - 8 + i*2, goal.y + goal.height); ctx.stroke();
      }
      for (let j = 1; j < 5; j++) {
        const y = goal.y + 6 + (j / 5) * goal.height;
        ctx.beginPath(); ctx.moveTo(goal.x, y); ctx.lineTo(goal.x + goal.width, y); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(goal.x, goal.y + 6, goal.width, goal.height - 2);
    }

    function drawKeeper() {
      const kx = keeper.x, ky = keeper.y;
      ctx.fillStyle = '#e11d48';
      roundRect(kx - 14, ky + 8, 28, 32, 6); ctx.fill();
      ctx.fillStyle = '#fcd34d';
      ctx.beginPath(); ctx.arc(kx, ky + 4, 11, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#e11d48'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      const armSpread = 18 + keeper.diveProgress * 22;
      ctx.beginPath(); ctx.moveTo(kx - armSpread, ky + 18); ctx.lineTo(kx, ky + 16); ctx.lineTo(kx + armSpread, ky + 18); ctx.stroke();
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath(); ctx.arc(kx - armSpread, ky + 18, 6, 0, Math.PI * 2); ctx.arc(kx + armSpread, ky + 18, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(kx - 12, ky + 38, 9, 16); ctx.fillRect(kx + 3, ky + 38, 9, 16);
    }

    function drawDefenders() {
      for (let d of defenders) {
        ctx.fillStyle = '#1d4ed8';
        roundRect(d.x - d.width/2, d.y, d.width, d.height - 10, 5); ctx.fill();
        ctx.fillStyle = '#fcd34d';
        ctx.beginPath(); ctx.arc(d.x, d.y - 2, 9, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#1d4ed8'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(d.x - 14, d.y + 12); ctx.lineTo(d.x, d.y + 10); ctx.lineTo(d.x + 14, d.y + 12); ctx.stroke();
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(d.x - 9, d.y + d.height - 12, 7, 12); ctx.fillRect(d.x + 2, d.y + d.height - 12, 7, 12);
      }
    }

    function drawTrail() {
      if (trail.length < 2) return;
      let color = '56, 189, 248';
      if (shotType === 'chip') color = '167, 139, 250';
      if (shotType === 'curve') color = '52, 211, 153';

      for (let i = 0; i < trail.length; i++) {
        const t = trail[i];
        if (t.life <= 0) continue;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 3.5 * t.life, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + color + ', ' + (t.life * 0.55) + ')';
        ctx.fill();
      }
    }

    function drawBall() {
      drawTrail();
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath(); ctx.ellipse(ball.x, ball.y + ball.radius + 2, ball.radius * 0.9, 4, 0, 0, Math.PI * 2); ctx.fill();
      const bg = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 0, ball.x, ball.y, ball.radius);
      bg.addColorStop(0, '#ffffff'); bg.addColorStop(0.7, '#e2e8f0'); bg.addColorStop(1, '#94a3b8');
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fillStyle = bg; ctx.fill();
      ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius * 0.55, 0, Math.PI * 2); ctx.stroke();
    }

    function drawAimAndPower() {
      if (phase === 'flying' || phase === 'result') return;
      let arrowColor = '#38bdf8';
      if (shotType === 'chip') arrowColor = '#a78bfa';
      if (shotType === 'curve') arrowColor = '#34d399';

      const ax = ball.x + aimAngle * 70;
      const ay = ball.y - 50;
      ctx.strokeStyle = arrowColor; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ball.x, ball.y - 12); ctx.lineTo(ax, ay); ctx.stroke();

      if (shotType === 'curve' && Math.abs(aimAngle) > 0.12) {
        ctx.beginPath(); ctx.setLineDash([5, 4]);
        const curveDir = aimAngle > 0 ? 1 : -1;
        ctx.moveTo(ax, ay);
        ctx.quadraticCurveTo(ax + curveDir * 30, ay - 25, ax + curveDir * 50, ay - 8);
        ctx.stroke(); ctx.setLineDash([]);
      }

      if (shotType === 'chip') {
        ctx.beginPath(); ctx.setLineDash([4, 4]);
        ctx.moveTo(ball.x, ball.y - 12);
        ctx.quadraticCurveTo(ball.x + aimAngle * 40, ball.y - 110, ax, ay - 30);
        ctx.stroke(); ctx.setLineDash([]);
      }

      ctx.fillStyle = arrowColor;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax - 7 - aimAngle * 4, ay + 12); ctx.lineTo(ax + 7 - aimAngle * 4, ay + 12); ctx.closePath(); ctx.fill();

      const barX = 350, barY = 170, barH = 140;
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(barX - 8, barY, 16, barH);
      ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2; ctx.strokeRect(barX - 8, barY, 16, barH);
      const fillH = power * barH;
      const grad = ctx.createLinearGradient(0, barY + barH, 0, barY);
      grad.addColorStop(0, '#22c55e'); grad.addColorStop(0.6, '#eab308'); grad.addColorStop(1, '#ef4444');
      ctx.fillStyle = grad; ctx.fillRect(barX - 6, barY + barH - fillH, 12, fillH);
      ctx.fillStyle = '#94a3b8'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('PWR', barX, barY + barH + 14);
    }

    function drawMessage() {
      if (messageTimer <= 0 || !message) return;
      ctx.save();
      ctx.globalAlpha = Math.min(1, messageTimer / 20);
      ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
      if (message.indexOf('PERFECT') !== -1 || message.indexOf('UNSTOPPABLE') !== -1) ctx.fillStyle = '#f472b6';
      else if (message.indexOf('GOAL') !== -1 || message.indexOf('STREAK') !== -1) ctx.fillStyle = '#4ade80';
      else if (message.indexOf('BLOCKED') !== -1) ctx.fillStyle = '#f97316';
      else ctx.fillStyle = '#f87171';
      ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 10;
      ctx.fillText(message, 190, 250);
      ctx.restore();
    }

    function draw() {
      drawPitch();
      drawGoal();
      drawDefenders();
      drawKeeper();
      drawBall();
      drawAimAndPower();
      drawMessage();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (380 / rect.width),
        y: (clientY - rect.top) * (580 / rect.height)
      };
    }

    function onStart(e) {
      if (gameOver || phase === 'flying' || phase === 'result') return;
      e.preventDefault();
      const p = getPos(e);

      pointerDown = true;
      lastX = p.x;
      if (phase === 'aim') {
        phase = 'power';
        charging = true;
        power = 0.15;
      }
    }

    function onMove(e) {
      if (!pointerDown || phase === 'flying' || phase === 'result') return;
      e.preventDefault();
      const p = getPos(e);
      aimAngle = Math.max(-1, Math.min(1, aimAngle + (p.x - lastX) * 0.012));
      lastX = p.x;
    }

    function onEnd(e) {
      if (!pointerDown) return;
      e.preventDefault();
      pointerDown = false;
      if (phase === 'power' && charging) {
        charging = false;
        shoot();
      }
    }

    canvas.addEventListener('touchstart', onStart, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onEnd, { passive: false });
    canvas.addEventListener('touchcancel', onEnd, { passive: false });
    canvas.addEventListener('mousedown', onStart);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onEnd);
    canvas.addEventListener('mouseleave', onEnd);

    btnBlast.addEventListener('click', () => setShotType('blast'));
    btnChip.addEventListener('click', () => setShotType('chip'));
    btnCurve.addEventListener('click', () => setShotType('curve'));

    restartBtn.addEventListener('click', startGame);

    shareBtn.addEventListener('click', () => {
      if (tg) {
        tg.sendData(JSON.stringify({ event: 'high_score', score: highScore, goals: goals }));
      } else {
        alert("High Score: " + highScore + "!");
      }
    });

    // --- Render Backend Leaderboard API Logic ---
    function submitScoreToLeaderboard() {
      const pName = playerNameInput.value.trim() || 'Anonymous';
      localStorage.setItem('cosmicPlayerName', pName);

      if (score <= 0) return;

      submitScoreBtn.disabled = true;
      submitScoreBtn.textContent = 'Saving...';

      fetch(RENDER_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: pName,
          score: score,
          goals: goals
        })
      })
      .then(res => res.json())
      .then(data => {
        submitScoreBtn.disabled = false;
        submitScoreBtn.textContent = 'Save';
        submitStatus.classList.remove('hidden');
      })
      .catch(err => {
        console.error('Error saving score:', err);
        submitScoreBtn.disabled = false;
        submitScoreBtn.textContent = 'Save';
      });
    }

    function loadLeaderboard() {
      leaderboardList.innerHTML = '<div class="text-xs text-slate-500 text-center py-6">Loading rankings...</div>';

      fetch(RENDER_API_URL)
        .then(res => res.json())
        .then(scores => {
          if (!scores || scores.length === 0) {
            leaderboardList.innerHTML = '<div class="text-xs text-slate-500 text-center py-6">No scores yet. Be the first!</div>';
            return;
          }

          leaderboardList.innerHTML = '';
          scores.forEach((s, idx) => {
            const item = document.createElement('div');
            const badgeColor = idx === 0 ? 'bg-amber-400 text-slate-950' : 
                               idx === 1 ? 'bg-slate-300 text-slate-950' : 
                               idx === 2 ? 'bg-amber-700 text-slate-100' : 
                               'bg-slate-800 text-slate-400';

            item.className = 'w-full flex justify-between items-center bg-slate-900/90 border border-slate-800/80 px-3 py-1.5 rounded-lg text-xs';
            item.innerHTML = `
              <div class="flex items-center gap-2 overflow-hidden">
                <span class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black \( {badgeColor}"> \){idx + 1}</span>
                <span class="font-semibold text-slate-200 truncate max-w-[120px]">${s.name}</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-[10px] text-slate-400 font-medium">${s.goals || 0}⚽</span>
                <span class="font-extrabold text-amber-300">${s.score}</span>
              </div>
            `;
            leaderboardList.appendChild(item);
          });
        })
        .catch(err => {
          leaderboardList.innerHTML = '<div class="text-xs text-red-400 text-center py-6">Failed to load scores.</div>';
        });
    }

    submitScoreBtn.addEventListener('click', submitScoreToLeaderboard);

    leaderboardBtn.addEventListener('click', () => {
      leaderboardModal.classList.remove('hidden');
      leaderboardModal.classList.add('flex');
      loadLeaderboard();
    });

    closeLeaderboardBtn.addEventListener('click', () => {
      leaderboardModal.classList.add('hidden');
      leaderboardModal.classList.remove('flex');
    });

    startGame();
    loop();
  </script>
</body>
</html>
